<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interpreting Results</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#F7F5F8;color:#232323;font-family:Calibri,Carlito,"Segoe UI",system-ui,sans-serif;
  font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 64px}
header{border-bottom:3px solid #4C2759;padding-bottom:10px;margin-bottom:14px}
h1{font-size:24px;margin:0 0 4px;color:#4C2759}
.sub{color:#6E6E6E;font-size:14px}
.card{background:#fff;border:1px solid #E3DAEA;border-radius:12px;padding:16px;margin-bottom:14px}
.intro p{margin:0 0 8px}
.intro p:last-child{margin:0}
.progress{display:flex;gap:6px;margin:14px 0}
.dot{flex:1;height:6px;border-radius:3px;background:#E3DAEA}
.dot.done{background:#2E7D32}
.dot.now{background:#4C2759}
.tagline{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#6A3A6F;font-weight:700;margin-bottom:8px}

.plist{display:flex;flex-direction:column;gap:10px}
.pcard{display:flex;gap:14px;align-items:flex-start;text-align:left;font:inherit;width:100%;
  background:#fff;border:1.5px solid #D7C9DE;border-radius:11px;padding:14px;cursor:pointer}
.pcard:hover{border-color:#4C2759}
.pcard.seen{background:#F4FAF4;border-color:#B6D8B6}
.pcard.on{border-color:#4C2759;border-width:2.5px;background:#F5F2F6}
.pcard.on .status{color:#4C2759}
.agree{background:#4C2759;color:#fff;border-radius:10px;padding:13px 15px;margin-bottom:12px;font-size:15.5px}
.pcard .meta{flex:1}
.pcard .status{flex:0 0 auto;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:#6A3A6F;padding-top:4px}
.pcard.seen .status{color:#2E7D32}
.pcard .status.open{background:#4C2759;color:#fff;border-radius:7px;padding:7px 11px;
  letter-spacing:.04em;text-transform:none;font-size:13.5px}
.pcard:hover .status.open{background:#3B1D45}
.avatar{flex:0 0 62px;width:62px;height:62px;border-radius:50%;object-fit:cover;display:block;
  border:2px solid #4C2759;background:#EDE9EE}
.pname{font-size:20px;font-weight:700;color:#4C2759;line-height:1.2}
.pwho{font-size:13.5px;color:#6E6E6E;display:block}
.pref{font-size:13px;color:#6E6E6E;margin-top:4px;display:block}
.listfoot{margin-top:16px;font-size:15px;color:#6E6E6E}

/* the report itself */
.report{background:#fff;border:1.5px solid #D7C9DE;border-radius:6px;padding:0;margin-bottom:16px;
  overflow:hidden}
.rhead{background:#4C2759;color:#fff;padding:12px 15px}
.rhead .lab{font-size:15px;font-weight:700;letter-spacing:.01em}
.rhead .kind{font-size:12px;color:rgba(255,255,255,.8);letter-spacing:.05em;text-transform:uppercase;
  margin-top:2px}
.rbody{padding:14px 15px}
.rrow{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid #F0EAF2;font-size:14.5px}
.rrow:last-child{border-bottom:none}
.rrow .k{flex:0 0 116px;font-weight:700;color:#6A3A6F;font-size:12.5px;letter-spacing:.03em;
  text-transform:uppercase;padding-top:2px}
.rrow .v{flex:1}
.mono{font-family:Consolas,"Courier New",monospace;font-size:14px;background:#F5F2F6;border-radius:4px;
  padding:2px 6px;display:inline-block}
.rsec{margin-top:14px;padding-top:12px;border-top:2px solid #EDE9EE}
.rsec h4{margin:0 0 6px;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:#6A3A6F}
.rsec p{margin:0;font-size:14.5px}
.rsec ul{margin:6px 0 0;padding-left:20px;font-size:14.5px}
.rsec li{margin-bottom:4px}
.rlimit{background:#F5F5F6;border-radius:6px;padding:10px 12px;margin-top:14px;font-size:13px;color:#5A5A5A}
.rlimit b{color:#4A4A4A;display:block;margin-bottom:3px;font-size:11.5px;letter-spacing:.05em;
  text-transform:uppercase}

.opening{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px;flex-wrap:wrap}
.opening img{flex:0 1 auto;width:auto;max-width:46%;max-height:190px;border-radius:10px;display:block}
.opening .txt{flex:1 1 220px}

.steplabel{font-weight:700;color:#4C2759;margin:18px 0 8px;font-size:17px}
.steplabel span{display:inline-block;width:26px;height:26px;border-radius:50%;background:#4C2759;color:#fff;
  text-align:center;line-height:26px;font-size:14px;margin-right:8px}
.stem{font-size:17px;font-weight:700;margin:0 0 10px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;font:inherit;font-size:16px;background:#fff;border:1.5px solid #D7C9DE;border-radius:9px;
  padding:12px 14px;cursor:pointer;min-height:46px;color:#232323;display:flex;gap:11px;align-items:flex-start}
.opt:hover{border-color:#4C2759}
.opt .ltr{flex:0 0 26px;height:26px;border-radius:50%;background:#EDE9EE;color:#6A3A6F;font-weight:700;
  font-size:14px;text-align:center;line-height:26px}
.opt.right{background:#E6F2E6;border-color:#2E7D32}
.opt.right .ltr{background:#2E7D32;color:#fff}
.opt.wrongpick{background:#FBEAEA;border-color:#B23B3B}
.opt.wrongpick .ltr{background:#B23B3B;color:#fff}
.opt[disabled]{cursor:default}

.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
button.primary{font:inherit;font-size:17px;font-weight:700;padding:12px 22px;border-radius:9px;
  border:2px solid #4C2759;background:#4C2759;color:#fff;cursor:pointer;min-height:46px}
button.primary.quiet{background:#fff;color:#4C2759}
button.link{font:inherit;font-size:15px;background:none;border:none;color:#6A3A6F;text-decoration:underline;
  cursor:pointer;padding:8px 4px}

.msg{margin-top:14px;border-radius:9px;padding:13px 14px;font-size:16px}
.msg.nudge{background:#EDE9EE;border-left:5px solid #4C2759}
.msg.good{background:#E6F2E6;border-left:5px solid #2E7D32}
.msg h3{margin:0 0 6px;font-size:16px}

.bubbles{margin-bottom:14px}
.b{max-width:88%;padding:11px 14px;border-radius:14px;margin-bottom:9px;font-size:16px}
.b.them{background:#F0EAF2;border-bottom-left-radius:4px}
.b.you{background:#4C2759;color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.b .speaker{display:block;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:#6A3A6F;
  font-weight:700;margin-bottom:3px}
.b.you .speaker{color:rgba(255,255,255,.72)}
.typing{display:inline-flex;gap:5px;align-items:center;padding:4px 0}
.typing i{width:8px;height:8px;border-radius:50%;background:#6A3A6F;display:block;
  animation:blink 1.2s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

textarea{width:100%;min-height:150px;font:inherit;font-size:16px;padding:12px;border:1.5px solid #D7C9DE;
  border-radius:9px;background:#fff;resize:vertical}
input[type=text]{width:100%;font:inherit;font-size:17px;padding:12px;border:1.5px solid #D7C9DE;
  border-radius:9px;background:#fff;color:#232323;min-height:48px}
.field{margin-bottom:18px}
.field label{display:block;font-weight:700;color:#4C2759;font-size:16px;margin-bottom:7px}
.hintline{font-size:14px;color:#6E6E6E;margin:6px 0 10px}
.ideas{list-style:none;margin:10px 0 0;padding:0}
.ideas li{padding:11px 12px 11px 40px;position:relative;border-radius:8px;margin-bottom:8px;font-size:15.5px}
.ideas li.hit{background:#E6F2E6}
.ideas li.miss{background:#fff;border:1.5px dashed #D7C9DE}
.ideas li .mark{position:absolute;left:12px;top:11px;font-weight:700;font-size:16px}
.ideas li.hit .mark{color:#2E7D32}
.ideas li.miss .mark{color:#B9A9C2}
.ideas li b{display:block}
.ideas li .nudge{font-size:14px;color:#6E6E6E;margin-top:3px}
.quote{background:#fff;border:1.5px solid #E3DAEA;border-left:6px solid #4C2759;border-radius:8px;
  padding:14px;font-size:16.5px}
.scoreline{font-size:20px;font-weight:700;color:#4C2759;margin:10px 0}
.finished{background:#2E7D32;color:#fff;border-radius:12px;padding:22px 18px;margin-bottom:14px;text-align:center}
.finished .tick{display:block;font-size:46px;line-height:1;margin-bottom:8px}
.finished .big{display:block;font-size:27px;font-weight:700;letter-spacing:.02em}
.finished .nm{display:block;font-size:20px;margin-top:8px;color:#D6EDD6}
.mebar{display:flex;align-items:center;gap:14px;background:#4C2759;color:#fff;border-radius:12px;
  padding:14px 16px;margin-bottom:14px}
.mebar .txt{flex:1}
.mebar .big{display:block;font-size:18px;font-weight:700;line-height:1.25}
.mebar .sm{display:block;font-size:14px;color:rgba(255,255,255,.82);margin-top:2px}
.mebar .homebtn{flex:0 0 auto;font:inherit;font-size:14px;font-weight:700;padding:9px 13px;border-radius:9px;
  border:1.5px solid rgba(255,255,255,.6);background:rgba(255,255,255,.12);color:#fff;cursor:pointer;
  min-height:42px;white-space:nowrap}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(28,12,32,.5);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:18px}
.leaving{background:#fff;border:1.5px solid #4C2759;border-left-width:5px;border-radius:12px;
  padding:18px 20px;font-size:16px;width:100%;max-width:470px;box-shadow:0 18px 46px rgba(28,12,32,.35)}
.leaving b{color:#4C2759}
body.locked{overflow:hidden}
.hidden{display:none}
@media(max-width:520px){
  body{font-size:16px} h1{font-size:21px} .pname{font-size:19px}
  .rrow{flex-direction:column;gap:2px} .rrow .k{flex:none}
  .opening img{max-width:100%}
  .mebar{flex-wrap:wrap} .mebar .homebtn{width:100%}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Interpreting Results</h1>
  <div class="sub">From karyotype to genome &middot; in-class activity</div>
</header>

<div class="card intro" id="intro">
  <p>The tests you ordered have come back for all five of them.</p>
  <p>Read each report, including the paragraph at the bottom that nobody reads. Then answer three questions on interpreting it, and say it to the person in front of you.</p>
</div>

<div id="setup"></div>
<div id="mebar"></div>
<div id="leavebox"></div>
<div class="progress hidden" id="prog"></div>
<div id="stage"></div>
<div id="finish" class="hidden"></div>
</div>

ferral": "Developmental delay, repaired heart defect, dysmorphic features.", "test": "Chromosomal microarray, peripheral blood", "indication": "Global developmental delay with a congenital anomaly.", "method": "Whole genome oligonucleotide and SNP microarray. Reporting threshold 50 kb for losses and 100 kb for gains.", "result_lines": [["Maya", "arr[GRCh37] 22q11.21(18,916,842_21,800,471)x1"], ["Size", "Approximately 2.9 Mb loss, single copy"], ["Parents", "Not present in either parent"]], "headline": "A pathogenic deletion of about 2.9 Mb at 22q11.2. New in Maya.", "interpretation": "This is the recurrent 22q11.2 deletion, the commonest microdeletion in humans and a well established cause of congenital heart disease, developmental delay, palatal differences, immune deficiency and hypocalcaemia. It was not found in either parent, so it has arisen new in Maya. The deletion explains her presentation.", "recommendations": ["Immunology and calcium studies if not already done.", "Palate, hearing and feeding assessment.", "Cardiology follow-up as arranged.", "Developmental support, and mental health awareness through adolescence.", "Genetic counselling. Recurrence risk is low but not zero."], "limitation": "A microarray detects gains and losses of DNA. It will not detect balanced rearrangements, or changes at the level of the DNA sequence within a gene.", "q_see": {"stem": "What was this test able to see, and what would it have missed?", "options": ["Anything wrong anywhere in her DNA", "Pieces of DNA gained or lost, but not rearrangements and not changes within a gene", "Only whole extra chromosomes", "The sequence of every gene"], "answer": 1, "why": "A microarray measures how much of each region is present. It finds missing and extra material, including pieces far too small for a karyotype, and it is blind to balanced rearrangements and to changes in the letters within a gene.", "wrongs": ["It reads amount, not sequence. A single letter change would not show up at all.", "", "It sees changes far smaller than a whole chromosome. That is the reason it was chosen.", "It does not read sequence. That is a panel, an exome or a genome."], "hint": "A microarray compares how much material is present. Ask what that means for a change where nothing has been gained or lost."}, "q_change": {"stem": "Her parents ask what difference a name makes when there is no cure. What is the answer?", "options": ["It makes no practical difference at this age", "It tells you what to watch for, and what to check now", "It means she will need fewer appointments", "It predicts how she will develop"], "answer": 1, "why": "A named condition brings a surveillance plan. Calcium and immune function are checkable today, and the palate, hearing and developmental follow-up all follow from the diagnosis rather than from waiting to see what happens.", "wrongs": ["It changes what happens this week. Calcium and immune studies are done because of this result, not because of her symptoms.", "", "Usually more, and better targeted. That is not a reason against knowing.", "It does not. The range is wide, and telling parents it predicts her future is both wrong and unkind."], "hint": "Look at what the recommendations actually ask you to arrange. A name is doing work there even when there is no treatment."}, "q_family": {"stem": "Both parents tested negative. What does that mean for the family?", "options": ["Nothing, since the deletion is in Maya", "The chance of it happening again in a future pregnancy is low but not zero, and Maya herself has a one in two chance of passing it on", "Her parents should be retested in a few years", "Her siblings all need testing now"], "answer": 1, "why": "A change new in the child carries a small recurrence risk, because it can be present in a proportion of a parent's eggs or sperm without being in their blood. For Maya herself it is a one in two chance in each of her own pregnancies.", "wrongs": ["It is why the parents were tested at all. Whether it is new or inherited changes what you tell them about a future pregnancy.", "", "The result does not change with time. Retesting them adds nothing.", "Unaffected siblings do not need testing for a change that arose new in Maya."], "hint": "Both parents tested negative, so this arose in Maya. Now think forward twice: her parents' next pregnancy, and then Maya's own."}, "concepts": [{"label": "One explanation for all of it", "keys": ["one", "single", "same", "explain", "together", "account", "cause", "reason"], "ask": "So are these separate problems, or all part of the same thing?", "nudge": "They have been managing a heart defect and a delay as separate problems. The value of the result is that it makes them one thing."}, {"label": "A piece of DNA is missing", "keys": ["missing", "deleted", "deletion", "absent", "gone", "lost", "not there", "chunk", "piece", "section", "books"], "ask": "What actually is it, though? What did they find?", "nudge": "Say what was found in plain words. A small run of the instructions is missing from one chromosome."}, {"label": "It tells you what to check and watch for", "keys": ["watch", "check", "monitor", "look out", "follow up", "surveillance", "calcium", "immune", "hearing", "palate", "plan", "screen"], "ask": "But there is no cure, so what does knowing actually do for her?", "nudge": "This is the question every parent asks and the one students skip. Knowing buys a surveillance plan."}], "reply_good": "So it is all the same thing. That actually helps. And there are things you can check now rather than us just waiting to see what happens.", "portrait": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICD/wAARCAEEAQQDASIAAhEBAxEB/8QAHQAAAAcBAQEAAAAAAAAAAAAAAAECBAUGBwMICf/EADsQAAEDAwMCBAQFAgUDBQAAAAEAAgMEBREGEiExQRMiUWEHFDJxI0JSgZEIFRYkM6GxJWJyJkNTweH  "Targeted capture and sequencing of the coding regions and splice sites of 28 genes, with copy number analysis. Average coverage 150x.", "result_lines": [["Gene", "FBN1"], ["Variant", "c.4096G>A  p.(Glu1366Lys), heterozygous"], ["Classification", "Variant of uncertain significance"]], "headline": "One variant found in FBN1, classified as uncertain significance.", "interpretation": "This variant has been reported at very low frequency in population databases and computational tools are not in agreement about its effect. There is insufficient evidence at this time to classify it as either disease causing or benign. It cannot be used to confirm or exclude a diagnosis.", "recommendations": ["Management on clinical grounds. Echocardiogram and ophthalmology as clinically indicated.", "Predictive testing of relatives is not appropriate for a variant of uncertain significance.", "Testing of affected relatives may help clarify the classification.", "Reclassification may occur as evidence accumulates. Contact the laboratory for review."], "limitation": "This panel covers the genes listed only. It will not detect changes in genes not on the panel, deep intronic changes, or most balanced rearrangements.", "q_see": {"stem": "What was this test able to see, and what would it have missed?", "options": ["Every gene, since a panel reads the whole genome and then filters it", "Only large deletions and duplications", "The letters in 28 chosen genes, and nothing outside those genes", "Every genetic cause of aortic disease"], "answer": 2, "why": "A panel reads the coding regions of the genes on it, properly and deeply. Anything in a gene not on the panel, and anything deep in the non-coding regions, is outside what it looked at.", "wrongs": ["Some laboratories work that way technically, but only the listed genes are analysed and reported. What is not on the list is not looked at.", "It reads single letters, which is why it found this change at all.", "", "It covers 28 of them. Aortic disease has causes beyond any panel, and this one is recent enough that genes are still being added."], "hint": "The report says how many genes were on the panel. Everything outside that number was never looked at."}, "q_change": {"stem": "Her younger brother asks whether he can be tested for it. What do you tell him?", "options": ["Yes, testing him will tell him whether he is at risk", "No, an uncertain variant cannot be used to test relatives", "Yes, but only after he turns 25", "No, because the variant is definitely harmless"], "answer": 1, "why": "Predictive testing needs a variant you can interpret. Testing him for an uncertain variant produces a result nobody can act on, in a second person.", "wrongs": ["It cannot tell him that. A result you cannot interpret in Leah is a result you cannot interpret in him either.", "", "Age is not the issue. The classification is.", "Nobody has said it is harmless. Uncertain means unknown, in both directions."], "hint": "The word to weigh is uncertain. Ask what you would actually be able to tell him if his result came back the same as hers."}, "q_family": {"stem": "Her brother asks to be tested. What do you tell him, and what happens to the result over time?", "options": ["He can be tested now, and the result will tell him his risk", "He cannot be tested predictively on an uncertain variant, and the classification may change as evidence builds", "He should wait until Leah develops symptoms", "Nothing will change. Uncertain results stay uncertain"], "answer": 1, "why": "Predictive testing needs a variant somebody can interpret. What can help is testing affected relatives, and the laboratory reviewing the classification as more is published. Leah's DNA will not change; what is known about it will.", "wrongs": ["A result nobody can interpret in Leah is a result nobody can interpret in him.", "", "Waiting for symptoms is not a plan, and it is not what decides whether he can be tested.", "They often do change. Variants are reclassified in both directions as evidence accumulates, which is why the report asks you to contact the laboratory."], "hint": "There are two halves to this one: what he can be offered now, and what happens to a classification as more people are tested."}, "concepts": [{"label": "Something was found, and it was read properly", "keys": ["found", "change", "variant", "spelling", "letter", "difference", "read", "picked up"], "ask": "So did they find something or not?", "nudge": "Start with the fact that something was found. Patients hear uncertain and assume the test found nothing."}, {"label": "What it means is not yet known", "keys": ["not know", "unknown", "uncertain", "unclear", "not sure", "cannot say", "no answer", "not settled", "not enough"], "ask": "But is it the thing that is wrong with me, or not?", "nudge": "Say the honest thing: the uncertainty is real and it is about knowledge, not about her."}, {"label": "It does not rule anything out, and care carries on", "keys": ["not rule out", "does not rule", "not clear you", "carry on", "still", "keep an eye", "echo", "heart", "scan", "follow", "monitor", "manage"], "ask": "So can I forget about it then?", "nudge": "This is the one that gets missed. An uncertain result is not a clearance, and her echo happens either way."}], "reply_good": "So they found something but they cannot tell me what it means. And it does not let me off the scan. That is not what I was hoping for, but I understand it.", "portrait": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICD/wAARCAEEAQQDASIAAhEBAxEB/8QAHAAAAQUBAQEAAAAAAAAAAAAAAAECBAUGBwMI/8QAOxAAAQMDAwIEBAUCBQUAAwAAAQACAwQFEQYSITFBEyJRYQcUMnEVQlKRoSOBFjNTYqIkQ4KSsVVy8P/EABkBAAIDAQAAAAAAAAAAAAAAAAADAQIEBf/EACMRAAICAgICAwEBAQAAAAAAAAABAhEDIRIxQVEEEyJhMkL/2gAMAwEAAhEDEQA/APoHxag90olnHUpOe3RLz6rNZooXxp0vizfqTUnKA xome studies are uninformative at first analysis and become informative on later review as new gene disease associations are published.", "recommendations": ["Reanalysis of the existing data in 12 to 18 months, or sooner if the picture changes.", "Genome sequencing may be considered, and covers regions this test does not.", "Continued clinical follow-up. Send an updated clinical summary at reanalysis."], "limitation": "Exome sequencing reads the coding regions of genes. It will not reliably detect repeat expansions, deep intronic changes, changes in regulatory regions, methylation changes, or most balanced rearrangements. Coverage is not complete across all genes.", "q_see": {"stem": "What was this test able to see, and what would it have missed?", "options": ["Everything in his DNA", "The coding parts of nearly all genes, and not the rest of the genome", "Only the genes already linked to seizures", "Nothing useful, since the result was negative"], "answer": 1, "why": "An exome reads the parts of genes that spell out proteins. Repeat expansions, deep intronic changes, regulatory regions and methylation all sit outside it, and coverage is not complete even within the coding regions.", "wrongs": ["The coding regions are about two per cent of the genome. The other ninety-eight per cent were not read.", "", "An exome is untargeted. It read the coding regions of about twenty thousand genes.", "The test worked and covered what it covers. What it did not do is find an answer."], "hint": "Exome is in the name of the test. Look at the method line and ask what proportion of the whole genome that is."}, "q_change": {"stem": "What happens next?", "options": ["He is discharged from genetics", "The data is looked at again in a year or so, and he stays in clinic", "The exome is repeated", "Nothing further is available"], "answer": 1, "why": "The sample does not need taking again. The data already exists and gets reanalysed as new genes are published, which is where a good proportion of these answers eventually come from.", "wrongs": ["Discharging him is how a family loses the answer that arrives two years later.", "", "Repeating the same test on the same sample finds the same thing. It is the analysis that is repeated, not the sequencing.", "Not true. Reanalysis and genome sequencing are both available."], "hint": "The report says no variant found, which is not the same as nothing being there. Look at what the recommendations say happens to the data."}, "q_family": {"stem": "What happens next for Ravi and his family?", "options": ["Testing is offered to his siblings", "He is discharged, since the test was negative", "The existing data is reanalysed in a year or so, genome sequencing is an option, and he stays in clinic", "The exome is repeated on a new sample"], "answer": 2, "why": "There is no variant to test anybody for. What there is, is data that can be looked at again as new genes are published, and a test that reads more of the genome if it is needed.", "wrongs": ["There is nothing to test them for. No variant was found.", "Discharging him is how a family loses the answer that arrives two years later.", "", "Repeating the sequencing on the same sample finds the same thing. It is the analysis that gets repeated."], "hint": "Read the recommendations and count how many separate things are being offered. Only one option holds all of them at once."}, "concepts": [{"label": "Nothing was found this time", "keys": ["not find", "no answer", "nothing", "did not find", "no explanation", "come back", "empty", "negative"], "ask": "So what did it show?", "nudge": "Say it plainly first. Softening the fact that there is no answer makes the rest of the conversation harder."}, {"label": "That is not the same as normal, because the test cannot see everything", "keys": ["not normal", "does not mean", "not rule out", "cannot see", "does not see", "miss", "limit", "outside", "only reads", "part of", "not everything"], "ask": "Does that mean there is nothing x4I5boBs//9k="}, {"speaker": "Noor's mother", "name": "Baby Noor", "who": "5 days old, neonatal intensive care", "referral": "Critically ill newborn. Poor feeding, hypotonia, seizures unresponsive to first-line treatment, abnormal metabolic screen.", "test": "Rapid whole genome sequencing, trio", "indication": "Critically ill neonate. Result required to guide management.", "method": "Rapid trio whole genome sequencing with phenotype-driven analysis. Reported four days after sample receipt.", "result_lines": [["Gene", "ALDH7A1"], ["Variant 1", "c.1279G>C  p.(Glu427Gln), maternal"], ["Variant 2", "c.834G>A  p.(Trp278*), paternal"], ["Classification", "Pathogenic. One on each copy of the gene."]], "headline": "Two pathogenic ALDH7A1 variants, one inherited from each parent.", "interpretation": "These two variants are on opposite copies of the gene, so both copies are affected. This is consistent with pyridoxine-dependent epilepsy, in which seizures do not respond to standard anticonvulsants and do respond to pyridoxine. Both parents are carriers and are unaffected.", "recommendations": ["Discuss pyridoxine with the treating team urgently.", "Biochemical confirmation as per local protocol.", "Genetic counselling. One in four risk in each future pregnancy.", "Carrier testing available to relatives of both parents."], "limitation": "Genome sequencing does not detect all types of genetic change. Some structural variants, repeat expansions and methylation changes remain difficult to call.", "q_see": {"stem": "What was this test able to see, and what would it have missed?", "options": ["Coding and non-coding sequence across the genome, though not every kind of change", "Only the coding regions, like an exome", "Absolutely everything, with no limits", "Only the genes on a metabolic panel"], "answer": 0, "why": "A genome reads coding and non-coding sequence in one test, which is why it was chosen for a baby with several systems involved and no time to test one thing at a time. Some structural changes, repeat expansions and methylation changes are still difficult to call.", "wrongs": ["", "A genome reads both. That is the difference between it and an exome, and it is on the report.", "Every report has a limitations paragraph, and this one does too. Read it again.", "It is untargeted. No panel was chosen, which is the point when nobody can name the condition in advance."], "hint": "Genome, not exome. Then read the limitation line for what it still cannot pick up."}, "q_change": {"stem": "What is the single most important thing about this result?", "options": ["It gives the family a name for what is happening", "It changes her treatment today", "It tells them the recurrence risk", "It confirms the metabolic screen"], "answer": 1, "why": "This condition is treatable and her seizures have not responded to the usual drugs. The result reaches the team while she is still in intensive care and changes what she is given. Everything else on the list matters, and none of it matters as much as that.", "wrongs": ["A name matters, and here it comes second to what the name lets you do.", "", "It does, and that conversation happens later. Today is about her treatment.", "Confirmation is not the point of a rapid test in a sick baby."], "hint": "She is in intensive care and deteriorating. Of the four things listed, ask which one changes something for her this week."}, "q_family": {"stem": "What does this mean for her parents and the wider family?", "options": ["Both parents are carriers, the chance is one in four in each future pregnancy, and carrier testing can be offered to relatives on both sides", "One parent is affected and should be treated", "Only the mother's side needs testing", "There is no risk to future pregnancies"], "answer": 0, "why": "One change came from each parent, so both carry one and are unaffected. Each future pregnancy carries a one in four chance, and relatives on both sides may be carriers.", "wrongs": ["", "Neither is affected. Carrying one changed copy alongside one working copy causes no symptoms, which is why neither of them knew.", "Both sides. One variant came from each parent.", "One in four in each pregnancy, which is why this conversation happens before they plan another."], "hint": "Look at how the two variants are described in the result, and where each of them came from."}, "concepts": [{"label": "They have found the cause", "keys": ["found", "cause", "reason", "explain", "why", "answer", "know now", "diagnos"], "ask": "Have they actually worked out what is wrong with her?", "nudge": "Lead with the fact that there is an answer. This mother has had five days of nobody knowing."}, {"label": "It changes her treatment now", "keys": ["treat", "treatment", "medicine", "medication", "vitamin", "pyridoxine", "b6", "give her", "start", "today", "now", "straight away", "change what"], "ask": "But does knowing actually help her?", "nudge": "This is the whole case. The answer arrived fast enough to change what she is given, which is why the test was worth doing this way."}, {"label": "Both parents carry it, and neither did anything wrong", "keys": ["both of you", "carrier", "carry", "each", "one from each", "not your fault", "nothing you did", "no idea", "healthy", "well"], "ask": "Is this something we passed on? Did we do something?", "nudge": "Parents of a recessive condition look for blame immediately. Say the carrier explanation before they ask."}], "reply_good": "Five days of nobody being able to tell me anything, and it is something you can treat. Please tell them now. And it is not something we did.", "portrait": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICD/wAARCAEEAQQDASIAAhEBAxEB/8QAHAAAAgIDAQEAAAAAAAAAAAAABQYDBAACBwEI/8QAQRAAAgEDAwMCBQMCAQoEBwAAAQIDAAQRBRIhBjFBE1EUIjJhcQcjQlKBFSQzNUNykZKhscFTYo /* ---------------------------------------------------- the name gate, same list as the first activity */
function flatten(s){
  return s.toLowerCase()
    .replace(/[4@]/g,'a').replace(/3/g,'e').replace(/[1!|]/g,'i')
    .replace(/0/g,'o').replace(/[5$]/g,'s').replace(/7/g,'t')
    .replace(/[^a-z]/g,'');
}
function cleanName(v){
  const raw = v.toLowerCase().replace(/[^a-z0-9]/g, '');
  if (BLOCKED_DIGITS.some(w => raw.includes(w))) return false;
  let all = flatten(v);
  SAFE.forEach(w => { all = all.split(w).join(''); });
  if (BLOCKED_ANY.some(w => all.includes(w))) return false;
  const words = v.split(/[^A-Za-z0-9@!|$]+/).map(flatten).filter(Boolean);
  return !words.some(w => BLOCKED_WORD.includes(w));
}

let chosen = null;

function renderSetup(){

    <div class="tagline">Before you start</div>
    <div class="field">

    const v = document.getElementById('nm').value.trim().replace(/\s+/g,' ');
    const msg = document.getElementById('setupmsg');
    if (v.length < 2) { msg.innerHTML = `<div class="msg nudge">Put your name in first.</div>`;
      document.getElementById('nm').focus();
      document.getElementById('nm').scrollIntoView({behavior:'smooth', block:'center'}); return; }

      document.getElementById('nm').scrollIntoView({behavior:'smooth', block:'center'}); return; }
    chosen = +b.dataset.i;
    who = v;

      <span class="txt">
        <span class="big">${escapeHtml(who.split(' ')[0])}, you are reading the reports</span>

    document.getElementById('home').onclick = goHome;

/* ---------------------------------------------------- leaving */
function goHome(){
  const onEnd = !document.getElementById('finish').classList.contains('hidden');
  if (onEnd || onList) { closeLeave(); renderList(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  const c = CASES[idx];
  if (done[idx] || tries === 0) { closeLeave(); renderList(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  document.getElementById('leavebox').innerHTML =
    `<div class="overlay" id="leaveover"><div class="leaving" role="dialog" aria-modal="true">
      <b>Leave ${c.name} and go back to the patient list?</b>
      You have started this report. If you leave now, ${c.name.split(' ')[0]} starts again from the top
      when you come back.
      <div class="actions">
        <button class="primary" id="leaveyes">Leave and choose another</button>
        <button class="primary quiet" id="leaveno">Stay here</button>
      </div>
    </div></div>`;
  document.body.classList.add('locked');
  document.getElementById('leaveyes').focus();
  document.getElementById('leaveyes').onclick = () => {
    closeLeave(); renderList(); window.scrollTo({top:0,behavior:'smooth'});
  };
  document.getElementById('leaveno').onclick = closeLeave;
  document.getElementById('leaveover').onclick = (e) => { if (e.target.id === 'leaveover') closeLeave(); };
  document.addEventListener('keydown', escLeave);
}
function closeLeave(){
  document.getElementById('leavebox').innerHTML = '';
  document.body.classList.remove('locked');
  document.removeEventListener('keydown', escLeave);
}
function escLeave(e){ if (e.key === 'Escape') closeLeave(); }

function drawProg(){
  document.getElementById('prog').innerHTML =
    CASES.map((c,i)=>`<div class="dot ${done[i]?'done':((!onList && i===idx)?'now':'')}"></div>`).join('');
}

/* ---------------------------------------------------- the patient list */
function renderList(){
  closeLeave();
  onList = true; runId++;
  drawProg();
  document.getElementById('intro').classList.remove('hidden');
  document.getElementById('finish').classList.add('hidden');
  const seen = done.filter(Boolean).length;
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  stage.appendChild(el(`<div class="card">
    <div class="tagline">Reports waiting</div>
    <div class="agree">Choose the next one together. Everyone in your group taps the same one.</div>
    <div class="plist">${CASES.map((c,i)=>`
      <button class="pcard ${done[i]?'seen':''}" data-i="${i}">
        <img class="avatar" src="${c.portrait}" alt="">
        <span class="meta">
          <span class="pname">${c.name}</span>
          <span class="pwho">${c.who}</span>
          <span class="pref">${c.test}</span>
        </span>
        <span class="status">${done[i]?'Read':'Waiting'}</span>
      </button>`).join('')}</div>
    <div class="listfoot" id="lf"></div>
    <div class="actions" id="la"></div>
  </div>`));
  [...document.querySelectorAll('.pcard')].forEach(b => b.onclick = () => {
    idx = +b.dataset.i; render(); window.scrollTo({top:0,behavior:'smooth'});
  });
  const lf = document.getElementById('lf');
  if (seen === CASES.length) {
    lf.textContent = 'All five read. You can go back into any of them, or see how you did.';
    document.getElementById('la').innerHTML = `<button class="primary" id="tofinish">See how you did</button>`;
    document.getElementById('tofinish').onclick = finish;
  } else {
    lf.textContent = `${seen} of ${CASES.length} read.`;
  }
}

    <div class="report">
      <div class="rhead">
        <div class="lab">${LAB}</div>
        <div class="kind">${c.test}</div>
      </div>
      <div class="rbody">
        <div class="rrow"><span class="k">Indication</span><span class="v">${c.indication}</span></div>
        <div class="rrow"><span class="k">Method</span><span class="v">${c.method}</span></div>
        ${c.result_lines.map(r => `<div class="rrow"><span class="k">${r[0]}</span>
          <span class="v"><span class="mono">${r[1]}</span></span></div>`).join('')}
        <div class="rsec">
          <h4>Interpretation</h4>
          <p>${c.interpretation}</p>
        </div>
        <div class="rsec">
          <h4>Recommendations</h4>
          <ul>${c.recommendations.map(x => `<li>${x}</li>`).join('')}</ul>
        </div>
        <div class="rlimit"><b>Limitations of this test</b>${c.limitation}</div>
      </div>
    </div>

    <div id="step1"></div>
    <div id="step2"></div>
    <div id="step3"></div>
    <div id="step4"></div>
    <div class="actions"><button class="link" id="back">Back to the patient list</button></div>
  </div>`));
  document.getElementById('back').onclick = goHome;
  askQ(c, 'q_see', 'step1', 1, () =>
    askQ(c, 'q_change', 'step2', 2, () =>
      askQ(c, 'q_family', 'step3', 3, () => openSay(c))));
}

/* ---------------------------------------------------- the two questions */
function askQ(c, key, slot, num, next){
  const q = c[key];
  const box = document.getElementById(slot);
  const L = ['A','B','C','D','E'];
  box.innerHTML = `
    <div class="steplabel"><span>${num}</span>${
      num === 1 ? 'What the test was able to see'
      : num === 2 ? 'What it changes, and why it matters'
      : 'Follow-up and family testing'}</div>
    <p class="stem">${q.stem}</p>
    <div class="opts">${q.options.map((o,i) =>
      `<button class="opt" data-i="${i}"><span class="ltr">${L[i]}</span><span>${o}</span></button>`).join('')}</div>
    <div id="m${slot}"></div>`;
  box.scrollIntoView({behavior:'smooth', block:'nearest'});
  const msg = document.getElementById('m'+slot);
  let used = 0;
  [...box.querySelectorAll('.opt')].forEach(b => b.onclick = () => {
    if (b.disabled) return;
    const i = +b.dataset.i;
    tries++;
    if (i === q.answer) {
      [...box.querySelectorAll('.opt')].forEach(o => o.disabled = true);
      b.classList.add('right');
      if (used === 0) {
        if (num === 1) seeGot[idx] = 1; else if (num === 2) changeGot[idx] = 1; else familyGot[idx] = 1;
      }
      msg.innerHTML = `<div class="msg good"><h3>Yes.</h3><p style="margin:6px 0 0">${q.why}</p></div>`;
      setTimeout(next, 700);
    } else {
      used++;
      b.classList.add('wrongpick'); b.disabled = true;
      if (num === 1) seeGot[idx] = 0; else if (num === 2) changeGot[idx] = 0; else familyGot[idx] = 0;
      msg.innerHTML = `<div class="msg nudge"><p style="margin:0">${q.wrongs[i]}</p>
        ${used >= 2 ? `<div class="askfriend" style="margin-top:10px">
          <p style="margin:0 0 6px"><b>A hint, and only a hint.</b> ${q.hint}</p>
          <p style="margin:0">Talk it through with another group, or ask your facilitator, before you
          pick again.</p></div>` : ''}</div>`;
    }
  });
}

/* ---------------------------------------------------- say it */
function openSay(c, prefill){
  const first = c.name.split(' ')[0];
  const box = document.getElementById('step4');
  box.innerHTML = `
    <div class="steplabel"><span>4</span>Now say it to ${c.speaker || first}</div>
    <div class="hintline">Agree the wording as a group, out loud, then each of you types the version you
      agreed. In plain words, as you would actually say it in the room.</div>
    <textarea id="ta" placeholder="What you would say...">${prefill ? escapeHtml(prefill) : ''}</textarea>
    <div class="actions">
      <button class="primary" id="say">Say it to ${first}</button>
      <button class="link" id="sayhome">Back to the patient list</button>
    </div>
    <div class="bubbles" id="saybub" style="margin-top:16px"></div>
    <div id="msg3"></div>`;
  box.scrollIntoView({behavior:'smooth', block:'nearest'});
  document.getElementById('say').onclick = () => grade(c);
  document.getElementById('sayhome').onclick = goHome;
}

function normalise(s){
  return (' ' + s.toLowerCase().replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ') + ' ');
}

function grade(c){
  const token = runId;
  const raw = document.getElementById('ta').value.trim();
  const msg = document.getElementById('msg3');
  if (raw.length < 25) {
    msg.innerHTML = `<div class="msg nudge">Say it to your group out loud first, then write down the
      version you agreed.</div>`;
    return;
  }
  const t = normalise(raw);
  const hits = c.concepts.map(cc => cc.keys.some(k => t.includes(k)));
  const got = hits.filter(Boolean).length;
  const firstMiss = hits.indexOf(false);
  ideasFound[idx] = Math.max(ideasFound[idx] || 0, got);
  done[idx] = true;
  drawProg();
  const say = document.getElementById('say');
  const ta = document.getElementById('ta');
  say.style.display = 'none'; ta.style.display = 'none';
  const bub = document.getElementById('saybub');
  bub.innerHTML =
    `<div class="b you"><span class="speaker">You</span>${escapeHtml(raw)}</div>
     <div class="b them" id="typing"><span class="speaker">${c.speaker || c.name}</span>
       <span class="typing"><i></i><i></i><i></i></span></div>`;
  bub.scrollIntoView({behavior:'smooth', block:'nearest'});
  setTimeout(() => {
    if (stale(token)) return;
    const node = document.getElementById('typing');
    if (!node) return;
    const reply = firstMiss === -1 ? c.reply_good : c.concepts[firstMiss].ask;
    node.innerHTML = `<span class="speaker">${c.speaker || c.name}</span>${reply}`;
    node.removeAttribute('id');
    setTimeout(() => { if (!stale(token)) showIdeas(c, hits, got, raw); }, 2000);
  }, 1300);
}

function showIdeas(c, hits, got, raw){
  const msg = document.getElementById('msg3');
  const first = c.name.split(' ')[0];
  const left = 3 - got;
  msg.innerHTML = `<div class="msg ${got === 3 ? 'good' : 'nudge'}">
    <h3>${got} of the 3 ideas came through.</h3>
    <p style="margin:6px 0 0">This looks for ideas, not wording. If you said something that means the
    same thing in different words, count it yourself.</p>
    <ul class="ideas">${c.concepts.map((cc,i) => `
      <li class="${hits[i]?'hit':'miss'}"><span class="mark">${hits[i]?'&#10003;':'&#8226;'}</span>
        <b>${cc.label}</b>${hits[i] ? '' : `<div class="nudge">${cc.nudge}</div>`}</li>`).join('')}</ul>
    ${got === 3 ? '' : `
    <div class="askfriend" style="margin-top:12px">
      <p style="margin:0 0 6px"><b>Go again, and name the ${left === 1 ? 'idea' : left + ' ideas'} you have not said yet.</b></p>
      <p style="margin:0">Nothing here is going to give you the wording. Go back into the report, work it
      out between you, or ask another group how they said it, then say the whole thing to ${first} again.</p>
    </div>`}
    <div class="actions">
      ${got === 3 ? '' : `<button class="primary" id="again">Say it again</button>`}
      <button class="primary${got === 3 ? '' : ' quiet'}" id="nextcase">Back to the patient list</button>
    </div>
  </div>`;
  const again = document.getElementById('again');
  if (again) again.onclick = () => openSay(c, raw);
  document.getElementById('nextcase').onclick = () => {
    renderList(); window.scrollTo({top:0,behavior:'smooth'});
  };
  msg.scrollIntoView({behavior:'smooth', block:'nearest'});
}

/* ---------------------------------------------------- finish */
function finish(){
  onList = true; runId++;
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('stage').innerHTML = '';
  drawProg();
  const f = document.getElementById('finish');
  f.classList.remove('hidden');
  const cTotal = seeGot.reduce((a,b)=>a+(b||0),0);
  const chTotal = changeGot.reduce((a,b)=>a+(b||0),0);
  const fTotal = familyGot.reduce((a,b)=>a+(b||0),0);
  const iTotal = ideasFound.reduce((a,b)=>a+(b||0),0);
  f.innerHTML = `<div class="finished">
    <span class="tick">&#10003;</span>
    <span class="big">All five read</span>
    <span class="nm">${escapeHtml(who)}</span>
  </div>
  <div class="card">
    <div class="tagline">How it went</div>
    <div class="scoreline">What the test could see, right first time: ${cTotal} of 5</div>
    <div class="scoreline">What it changes, right first time: ${chTotal} of 5</div>
    <div class="scoreline">Follow-up and family testing, right first time: ${fTotal} of 5</div>
    <div class="scoreline">Ideas that came through when you explained it: ${iTotal} of 15</div>
    <p>The last number is the one that matters. Naming a result is the easy half; the patient only
    ever gets the half you can say out loud.</p>
  </div>
  <div class="card">
    <div class="tagline">Worth carrying out of here</div>
    <div style="font-size:20px;font-weight:700;color:#4C2759;margin-bottom:6px">Five results, five different jobs</div>
    <ul class="ideas">
      <li class="hit"><span class="mark">1</span><b>A found cause</b>
        <div class="nudge">Sandra. It explains the losses and it is not an illness she has.</div></li>
      <li class="hit"><span class="mark">2</span><b>A diagnosis with a plan attached</b>
        <div class="nudge">Maya. The name is worth having because of what it tells you to check.</div></li>
      <li class="hit"><span class="mark">3</span><b>An answer nobody can interpret yet</b>
        <div class="nudge">Leah. Uncertain is not negative, and it does not clear her.</div></li>
      <li class="hit"><span class="mark">4</span><b>No answer, and not an exclusion</b>
        <div class="nudge">Ravi. Uninformative, not normal. The data gets looked at again.</div></li>
      <li class="hit"><span class="mark">5</span><b>An answer that changes treatment today</b>
        <div class="nudge">Noor. Speed was the point of the test.</div></li>
    </ul>
    <div class="msg nudge" style="margin-top:16px">
      <h3>The one line to leave with</h3>
      <p style="margin:6px 0 0">The DNA does not change. What we know about it does, so the same report
      can mean something different in three years. Every one of these results is a snapshot of what
      is known today.</p>
    </div>
    <div class="actions"><button class="primary quiet" id="backlist">Back to the patient list</button></div>
  </div>`;
  document.getElementById('backlist').onclick = () => { renderList(); window.scrollTo({top:0,behavior:'smooth'}); };
  window.scrollTo({top:0,behavior:'smooth'});
}

renderSetup();
</script>
