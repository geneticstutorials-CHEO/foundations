<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genetics Tutorials: Foundations</title>
<meta name="description" content="Genetics tutorials for the University of Ottawa Faculty of Medicine, with CHEO. Online module, tutorial pages and group pages.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --shell:#232323;
  --shell-2:#2f2d33;
  --shell-3:#3a373f;
  --plum:#4C2759;
  --purple:#6A3A6F;
  --purple-lift:#8b5e93;
  --purple-soft:#9C8AAE;
  --tint:#F5F2F6;
  --tint-2:#EDE9EE;
  --line:#E3DAEA;
  --line-2:#e6e4e8;
  --ink:#1A1A1A;
  --ink-2:#232323;
  --body:#3a3740;
  --muted:#6E6E6E;
  --green:#2E7D32;
  --green-bg:#E6F2E6;
  --amber:#B7791F;
  --amber-bg:#FBF1D6;
  --rail-w:300px;
  --sans:'Mulish','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --mono:'Courier New',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;font-family:var(--sans);color:var(--ink);background:#fff;
  -webkit-font-smoothing:antialiased;font-size:16px;
}
a{color:var(--purple)}
button{font:inherit}
:focus-visible{outline:3px solid var(--purple-lift);outline-offset:2px;border-radius:2px}

.skip{position:absolute;left:-9999px;top:0;background:#fff;color:var(--purple);padding:10px 16px;z-index:60;font-weight:700}
.skip:focus{left:8px;top:8px}

.layout{display:flex;min-height:100vh;align-items:flex-start}

/* ---------------- rail ---------------- */
.rail{
  flex:0 0 var(--rail-w);width:var(--rail-w);
  position:sticky;top:0;height:100vh;overflow-y:auto;overflow-x:hidden;
  background:var(--shell);color:#e7e5ea;z-index:40;
  scrollbar-width:thin;scrollbar-color:#4a474f var(--shell);
}
.rail::-webkit-scrollbar{width:8px}
.rail::-webkit-scrollbar-thumb{background:#4a474f;border-radius:8px}

.hero{position:relative;height:206px;flex:none}
.hero-art{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero-top{position:absolute;top:12px;right:12px;display:flex;gap:4px}
.iconbtn{
  width:34px;height:34px;border:0;background:transparent;color:#fff;cursor:pointer;
  border-radius:50%;display:grid;place-items:center;transition:background .15s
}
.iconbtn:hover{background:rgba(255,255,255,.16)}
.hero-body{position:absolute;left:0;right:0;bottom:0;padding:0 22px 18px}
.hero-title{font-size:27px;line-height:1.08;font-weight:800;letter-spacing:-.02em;color:#fff;margin:0}
.hero-sub{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.72);margin:0 0 8px}
.bar{height:3px;background:rgba(255,255,255,.26);margin-top:15px;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:2px;transition:width .35s ease}
.bar-label{font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.82);margin-top:9px}

.filter{padding:12px 16px;display:none;border-bottom:1px solid rgba(255,255,255,.08)}
.filter.on{display:block}
.filter input{
  width:100%;padding:9px 12px;border-radius:4px;border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.07);color:#fff;font-size:13.5px
}
.filter input::placeholder{color:rgba(255,255,255,.45)}

.nav{padding:6px 0 40px}
.nav-sec{border-top:1px solid rgba(255,255,255,.07)}
.nav-sec:first-child{border-top:0}
.nav-head{
  width:100%;display:flex;align-items:center;gap:9px;background:transparent;border:0;cursor:pointer;
  padding:19px 22px 11px;color:#a7a2ae;font-size:10.5px;font-weight:800;letter-spacing:.13em;
  text-transform:uppercase;text-align:left
}
.nav-head .caret{transition:transform .2s;flex:none}
.nav-head[aria-expanded="false"] .caret{transform:rotate(-90deg)}
.nav-list{list-style:none;margin:0;padding:0 0 6px}
.nav-head[aria-expanded="false"] + .nav-list{display:none}
.nav-item{
  display:flex;align-items:flex-start;gap:12px;width:100%;text-decoration:none;
  padding:13px 20px 13px 22px;color:#d6d3db;font-size:13.5px;line-height:1.36;font-weight:600;
  border-left:3px solid transparent;border-bottom:1px solid rgba(255,255,255,.05);
  transition:background .15s,color .15s
}
.nav-item:hover{background:var(--shell-2);color:#fff}
.nav-item[aria-current="page"]{background:var(--shell-2);border-left-color:var(--purple-lift);color:#fff}
.nav-item .glyph{flex:none;margin-top:1px;opacity:.65}
.nav-item .txt{flex:1 1 auto;min-width:0}
.nav-item .disc{flex:none;margin-top:1px;opacity:.55}
.nav-item[aria-current="page"] .disc,.nav-item[aria-current="page"] .glyph{opacity:1}
.nav-item.hide{display:none}

.rail-foot{padding:18px 22px 34px;border-top:1px solid rgba(255,255,255,.07);color:#8f8a97;font-size:11.5px;line-height:1.6}
.rail-foot a{color:#c3bccb}

/* ---------------- topbar (small screens) ---------------- */
.topbar{
  display:none;position:sticky;top:0;z-index:35;background:#fff;border-bottom:1px solid var(--line-2);
  padding:10px 14px;align-items:center;gap:12px
}
.topbar .burger{width:38px;height:38px;border:0;background:transparent;border-radius:6px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.topbar .burger:hover{background:var(--tint)}
.topbar .where{font-size:13px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scrim{display:none;position:fixed;inset:0;background:rgba(20,16,24,.5);z-index:38}

/* ---------------- main ---------------- */
main{flex:1 1 auto;min-width:0}
.wrap{max-width:768px;margin:0 auto;padding:66px 44px 56px}
.back{
  display:inline-flex;align-items:center;gap:7px;margin:0 0 22px;text-decoration:none;
  font-size:13px;font-weight:700;color:var(--muted);padding:7px 12px 7px 9px;
  border:1px solid var(--line-2);border-radius:4px;transition:color .15s,border-color .15s,background .15s
}
.back:hover{color:var(--plum);border-color:var(--purple);background:var(--tint)}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--purple);margin:0 0 14px}
h1{
  font-size:34px;line-height:1.14;font-weight:800;letter-spacing:-.02em;color:var(--ink);
  margin:0 0 22px;padding-bottom:20px;position:relative
}
h1::after{content:"";position:absolute;left:0;bottom:0;width:88px;height:5px;background:var(--purple)}
.lede{font-size:18px;line-height:1.65;color:var(--body);margin:0 0 8px;max-width:62ch}
p{font-size:16px;line-height:1.72;color:var(--body);max-width:66ch}
.h2{
  font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
  margin:52px 0 20px;padding-top:20px;border-top:1px solid var(--line-2)
}
.mono{font-family:var(--mono);font-size:.94em}
.card p,.obj p,.step p,.note p,.hero-sub{max-width:none}
main:focus{outline:none}

/* steps */
.steps{margin:26px 0 0;padding:0;list-style:none}
.step{display:flex;gap:18px;padding:20px 0;border-bottom:1px solid var(--line-2)}
.step:last-child{border-bottom:0}
.step .n{
  flex:none;width:30px;height:30px;border-radius:50%;background:var(--plum);color:#fff;
  display:grid;place-items:center;font-size:13px;font-weight:800
}
.step h3{margin:3px 0 6px;font-size:16.5px;font-weight:800;color:var(--ink)}
.step p{margin:0;font-size:15px;line-height:1.62}

/* objectives */
.objs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px}
.obj{background:var(--tint);border-radius:6px;padding:20px 20px 22px;display:flex;gap:14px}
.obj .n{font-size:28px;font-weight:800;color:var(--purple-soft);line-height:1;flex:none}
.obj p{margin:2px 0 0;font-size:14.5px;line-height:1.55;color:var(--ink-2)}

/* plan */
.plan{margin-top:22px;border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.plan-row{display:flex;align-items:center;gap:16px;padding:13px 18px;border-top:1px solid var(--line-2)}
.plan-row:first-child{border-top:0}
.plan-row .n{
  flex:none;width:26px;height:26px;border-radius:4px;background:var(--plum);color:#fff;
  display:grid;place-items:center;font-size:12.5px;font-weight:800
}
.plan-row .nm{flex:1 1 auto;font-size:15px;font-weight:600;color:var(--ink-2)}
.plan-row .tm{flex:none;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* cards */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}
.cards.one{grid-template-columns:1fr}
.cards.big{gap:18px;margin-top:30px}
.cards.big .card{padding:34px 30px 30px}
.cards.big .card h3{font-size:26px;letter-spacing:-.02em;margin-bottom:10px}
.cards.big .card p{font-size:15px}
.card{
  display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line-2);
  border-radius:8px;padding:22px 22px 20px;transition:border-color .16s,box-shadow .16s,transform .16s
}
.card:hover{border-color:var(--purple);box-shadow:0 10px 26px -18px rgba(76,39,89,.7);transform:translateY(-2px)}
.card .k{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--purple);margin-bottom:9px}
.card h3{margin:0 0 8px;font-size:18px;line-height:1.28;font-weight:800;letter-spacing:-.01em}
.card p{margin:0;font-size:14.5px;line-height:1.58;color:var(--muted)}
.card .go{margin-top:14px;font-size:13px;font-weight:800;color:var(--purple);display:flex;align-items:center;gap:7px}
.card .shot{
  display:block;width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:5px;
  margin:0 0 16px;background:var(--tint-2)
}
.card .slot{
  display:grid;place-items:center;width:100%;aspect-ratio:16/10;border-radius:5px;
  margin:0 0 16px;border:1.5px dashed #c9c5cf;background:var(--tint);
  color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;text-align:center;padding:8px
}
.card.soon{cursor:default}
.card.soon:hover{border-color:var(--line-2);box-shadow:none;transform:none}
.card.soon h3{color:var(--muted)}
.soon-tag{
  display:inline-block;margin-top:14px;font-size:10px;font-weight:800;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);border:1px dashed #c9c5cf;border-radius:3px;padding:5px 9px
}
.pill{
  display:inline-block;margin:0 0 18px;font-size:10.5px;font-weight:800;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);border:1px dashed #c9c5cf;border-radius:3px;padding:6px 11px
}

/* resources */
.res{margin-top:22px;border-top:1px solid var(--line-2)}
.res-row{
  display:flex;align-items:center;gap:16px;padding:17px 4px;border-bottom:1px solid var(--line-2);
  text-decoration:none;color:inherit;transition:background .14s
}
a.res-row:hover{background:var(--tint)}
.res-row .body{flex:1 1 auto;min-width:0}
.res-row .ttl{font-size:15.5px;font-weight:700;color:var(--ink);line-height:1.35}
a.res-row:hover .ttl{color:var(--plum)}
.res-row .sub{font-size:13.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.tag{
  flex:none;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  padding:5px 9px;border-radius:3px;background:var(--tint);color:var(--plum)
}
.res-row.todo{opacity:.72}
.res-row.todo .ttl{color:var(--muted);font-weight:600}
.tag.todo{background:#fff;color:var(--muted);border:1px dashed #c9c5cf}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:22px}
.grp{
  text-decoration:none;display:flex;align-items:center;justify-content:center;gap:10px;
  padding:20px 12px;border-radius:6px;background:var(--plum);color:#fff;
  font-size:15px;font-weight:800;letter-spacing:.01em;transition:background .15s,transform .15s
}
.grp:hover{background:var(--purple);transform:translateY(-2px)}

/* note */
.note{background:var(--tint);border-radius:6px;padding:20px 22px;margin-top:26px}
.note h3{margin:0 0 7px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--plum)}
.note p{margin:0;font-size:15px;line-height:1.62;color:var(--ink-2)}

.pagefoot{
  max-width:768px;margin:0 auto;padding:26px 44px 60px;border-top:1px solid var(--line-2);
  color:var(--muted);font-size:12.5px;line-height:1.7
}

@media (max-width:1080px) and (min-width:821px){
  :root{--rail-w:250px}
  .wrap,.pagefoot{padding-left:32px;padding-right:32px}
}
@media (max-width:820px){
  .layout{display:block}
  .topbar{display:flex}
  .rail{
    position:fixed;top:0;left:0;bottom:0;height:100dvh;width:294px;flex:none;
    transform:translateX(-100%);transition:transform .25s ease
  }
  .rail.open{transform:none}
  .scrim.on{display:block}
  .wrap{padding:38px 22px 30px}
  .pagefoot{padding:22px 22px 48px}
  h1{font-size:28px}
  .lede{font-size:17px}
  .cards,.objs{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<div class="topbar">
  <button class="burger" id="burger" aria-label="Open contents" aria-expanded="false">
    <svg width="20" height="14" viewBox="0 0 20 14" aria-hidden="true"><g fill="currentColor"><rect width="20" height="2" rx="1"/><rect y="6" width="20" height="2" rx="1"/><rect y="12" width="20" height="2" rx="1"/></g></svg>

  <span class="where" id="where">Genetics Tutorials</span>
</div>

<div class="layout">

      <svg class="hero-art" viewBox="0 0 320 206" preserveAspectRatio="xMidYMid slice" aria-hidden="true">

            <g stroke="#25102b" stroke-width="1.7" stroke-linecap="round" opacity=".85">
              <path d="M153 141h14"/><path d="M152 132h16"/><path d="M153 123h14"/>

        <use href="#tree"/>
        <rect width="320" height="206" fill="url(#fade)"/>
      </svg>
      <div class="hero-top">
        <button class="iconbtn" id="searchBtn" aria-label="Search contents" aria-expanded="false">
          <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M12.8 12.8 17 17" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="hero-body">
        <p class="hero-sub">Foundations</p>
        <p class="hero-title">Genetics<br>content</p>
        <div class="bar"><i id="bar" style="width:0%"></i></div>
        <div class="bar-label" id="barLabel">Home</div>
      </div>
    </div>
    <div class="filter" id="filter">
      <input type="search" id="filterInput" placeholder="Filter contents" aria-label="Filter contents">
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot">
      University of Ottawa Faculty of Medicine, with CHEO.<br>
      Questions: your tutor, or the contact on the board.
    </div>
  </aside>

  <main id="main" tabindex="-1">
    <div class="wrap" id="page"></div>
    <div class="pagefoot" id="pagefoot"></div>
  </main>

<script>
/* =====================================================================
   EDIT BELOW. Everything students see is in this one object.
   Each page: id, slug (the address after #/), lang, area, parent,
   navTitle, and blocks. Add a link by filling in its "url".
   Leave url as "" and it shows as a greyed slot instead of a dead link.
   ===================================================================== */

var LINKS = {
  /* To put a picture on a card later: upload it to an images/ folder beside
     this file and add img:"images/name.png" to that card. */

  /* Pre-work modules are not linked from this site: they live in Brightspace.
     These two are the older Drive copies, kept in case they are needed again. */
  moduleEN:  "https://drive.google.com/file/d/186qhSjTyGQhcGy6TjdYEhKD-3xr4Tk0_/view?usp=sharing",
  moduleFR:  "https://drive.google.com/file/d/1sZRuRBf7GLh5k66MR3opFoCCxqCfhljB/view?usp=sharing",

  t1Deck:    "https://drive.google.com/file/d/1KoqKE0M6kvUvOR04CFTrWp4rF_V7Kcrc/view?usp=sharing",
  t1DeckAns: "https://drive.google.com/file/d/14BtjMA9A6hFBhLuHBU3BpV-6uHu70BcB/view?usp=sharing"
};

var UI = {
  en:{cont:"Continue", next:"Next", group:"Group", todo:"Link to add", open:"Open", groups:"Your tutorial group", img:"Image to come", soon:"Coming this year", back:"Back to", home:"Home"},
  fr:{cont:"Continuer", next:"Suivant", group:"Groupe", todo:"Lien à ajouter", open:"Ouvrir", groups:"Votre groupe de tutorat", img:"Image à venir", soon:"À venir cette année", back:"Retour à", home:"Accueil"}
};

function groupPage(lang, tut, n, res){
  var L = UI[lang];
  return {
    id: lang+"-t"+tut+"-g"+n,
    slug: (lang==="en"?"english":"francais")+"/"+(lang==="en"?"tutorial":"tutorat")+"-"+tut+"/"+(lang==="en"?"group":"groupe")+"-"+n,
    lang: lang, area: lang, parent: lang+"-t"+tut,
    navTitle: L.group+" "+n,
    eyebrow: (lang==="en"?"Tutorial ":"Tutorat ")+["","I","II","III"][tut],
    title: L.group+" "+n,
    blocks: [
      {t:"lede", text: lang==="en"
        ? "Open these on your device during the session. Everyone in the group works from the same page."
        : "Ouvrez ces liens sur votre appareil pendant la séance. Tout le groupe travaille à partir de la même page."},
      {t:"res", items: res}
    ]
  };
}

function stdGroupRes(lang){
  var en = lang === "en";
  return [
    {ttl: en?"Patterns of inheritance activity":"Activité sur les modes de transmission",
     sub: en?"Shared slides your group edits together.":"Diapositives partagées que votre groupe modifie ensemble.",
     tag:"Slides", url:""},
    {ttl: en?"Interactive questions: patterns of inheritance":"Questions interactives : modes de transmission",
     sub:"", tag:"Form", url:""},
    {ttl: en?"Interactive questions: genetic testing":"Questions interactives : tests génétiques",
     sub:"", tag:"Form", url:""},
    {ttl: en?"Interactive questions: genetic test results":"Questions interactives : résultats des tests",
     sub:"", tag:"Form", url:""}
  ];
}

var PAGES = [

  ];
  made.forEach(function(g){

var SECTIONS = [
  {id:"home", label:null},
  {id:"en",   label:"English"},
  {id:"fr",   label:"Français"}
];

/* =====================  rendering  ===================== */

var byId = {}, bySlug = {};
PAGES.forEach(function(p){ byId[p.id] = p; bySlug[p.slug] = p; });

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

var GLYPH = '<svg class="glyph" width="15" height="12" viewBox="0 0 15 12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M1 1.5h13M1 6h9M1 10.5h11"/></svg>';
var DISC_PAGE = '<svg class="disc" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="7" cy="7" r="6"/></svg>';
var ARROW = '<svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 11 3M5 3h6v6"/></svg>';
var CHEV = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 2l4 4-4 4"/></svg>';
var CARET = '<svg class="caret" width="9" height="6" viewBox="0 0 10 7" fill="currentColor" aria-hidden="true"><path d="M5 7 0 0h10z"/></svg>';

function buildNav(){
  var nav = document.getElementById("nav");
  nav.innerHTML = SECTIONS.map(function(sec){
    var list = PAGES.filter(function(p){ return p.area === sec.id && !p.parent; })
      .map(function(p){ return '<li>'+row(p)+'</li>'; }).join("");
    if (!sec.label) return '<div class="nav-sec" data-sec="'+sec.id+'"><ul class="nav-list">'+list+'</ul></div>';
    return '<div class="nav-sec" data-sec="'+sec.id+'">'+
      '<button class="nav-head" aria-expanded="true" data-toggle="'+sec.id+'">'+CARET+'<span>'+esc(sec.label)+'</span></button>'+
      '<ul class="nav-list">'+list+'</ul></div>';
  }).join("");

  nav.querySelectorAll("[data-toggle]").forEach(function(b){
    b.addEventListener("click", function(){
      b.setAttribute("aria-expanded", b.getAttribute("aria-expanded") === "true" ? "false" : "true");
    });
  });
}
function row(p){
  return '<a class="nav-item" href="#/'+p.slug+'" data-page="'+p.id+'">'+
    GLYPH + '<span class="txt">'+esc(p.navTitle)+'</span>' + DISC_PAGE + '</a>';
}

function blockHTML(b, page){
  var L = UI[page.lang];
  switch(b.t){
    case "lede":  return '<p class="lede">'+esc(b.text)+'</p>';
    case "p":     return '<p>'+esc(b.text)+'</p>';
    case "h2":    return '<div class="h2">'+esc(b.text)+'</div>';
    case "steps": return '<ul class="steps">'+b.items.map(function(s){
        return '<li class="step"><span class="n">'+s.n+'</span><div><h3>'+esc(s.h)+'</h3><p>'+esc(s.p)+'</p></div></li>';
      }).join("")+'</ul>';
    case "objs":  return '<div class="objs">'+b.items.map(function(o,i){
        return '<div class="obj"><span class="n">'+(i+1)+'</span><p>'+esc(o)+'</p></div>';
      }).join("")+'</div>';
    case "plan":  return '<div class="plan">'+b.rows.map(function(r){
        return '<div class="plan-row"><span class="n">'+r.n+'</span><span class="nm">'+esc(r.nm)+'</span><span class="tm">'+esc(r.tm)+'</span></div>';
      }).join("")+'</div>';
    case "cards": return '<div class="cards'+(b.one?" one":"")+(b.big?" big":"")+'">'+b.items.map(function(c){
        var href = c.to ? "#/"+byId[c.to].slug : c.url;
        var ext  = !c.to;
        var pic  = ("img" in c)
          ? (c.img ? '<img class="shot" src="'+c.img+'" alt="">'
                   : '<span class="slot">'+esc(L.img)+'</span>')
          : "";
        var inner = pic + (c.k?'<div class="k">'+esc(c.k)+'</div>':'') +
                    '<h3>'+esc(c.h)+'</h3><p>'+esc(c.p)+'</p>';
        if (c.soon || (!c.to && !c.url))
          return '<div class="card soon">'+inner+'<span class="soon-tag">'+esc(c.soon?L.soon:L.todo)+'</span></div>';
        return '<a class="card" href="'+href+'"'+(ext?' target="_blank" rel="noopener"':'')+'>'+inner+
          '<span class="go">'+esc(c.go || L.open)+' '+(ext?ARROW:CHEV)+'</span></a>';
      }).join("")+'</div>';
    case "pill":  return '<span class="pill">'+esc(b.text)+'</span>';
    case "res":   return '<div class="res">'+b.items.map(function(r){
        var body = '<div class="body"><div class="ttl">'+esc(r.ttl)+'</div>'+
                   (r.sub?'<div class="sub">'+esc(r.sub)+'</div>':'')+'</div>';
        if (!r.url) return '<div class="res-row todo">'+body+'<span class="tag todo">'+esc(L.todo)+'</span></div>';
        return '<a class="res-row" href="'+r.url+'" target="_blank" rel="noopener">'+body+
               '<span class="tag">'+esc(r.tag)+'</span><span style="color:var(--purple)">'+ARROW+'</span></a>';
      }).join("")+'</div>';
    case "groups":return '<div class="groups">'+b.items.map(function(g){
        return '<a class="grp" href="#/'+byId[g.to].slug+'">'+esc(L.group)+' '+g.n+'</a>';
      }).join("")+'</div>';
    case "note":  return '<div class="note"><h3>'+esc(b.h)+'</h3><p>'+esc(b.p)+'</p></div>';
    default:      return "";
  }
}

var BACK = '<svg width="13" height="13" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2 4 6l4 4"/></svg>';

function upFrom(page){
  if (page.id === "home") return null;
  if (page.parent) return byId[page.parent];
  var area = byId[page.area];
  return (area && area !== page) ? area : byId.home;
}

function render(page){
  var L = UI[page.lang];
  document.documentElement.lang = page.lang;
  document.title = (page.id === "home" ? "" : page.title + " · ") + "Genetics Tutorials: Foundations";

  var up = upFrom(page);
  var back = up
    ? '<a class="back" href="#/'+up.slug+'">'+BACK+esc(L.back)+' '+esc(up.id === "home" ? L.home : (up.backTitle || up.navTitle))+'</a>'
    : "";

  document.getElementById("page").innerHTML = back +
    '<p class="eyebrow">'+esc(page.eyebrow)+'</p><h1>'+esc(page.title)+'</h1>'+
    page.blocks.map(function(b){ return blockHTML(b, page); }).join("");

  document.getElementById("pagefoot").innerHTML =
    'Genetics Tutorials: Foundations · University of Ottawa Faculty of Medicine, with CHEO';

  document.querySelectorAll(".nav-item").forEach(function(a){
    if (a.dataset.page === page.id) a.setAttribute("aria-current","page");
    else a.removeAttribute("aria-current");
  });
  document.querySelectorAll(".nav-head").forEach(function(b){
    b.setAttribute("aria-expanded", b.dataset.toggle === page.area ? "true" : b.getAttribute("aria-expanded"));
  });

  var inArea = PAGES.filter(function(p){ return p.area === page.area && !p.parent; });
  var pos = inArea.indexOf(page.parent ? byId[page.parent] : page) + 1;
  var secLabel = (SECTIONS.filter(function(s){ return s.id === page.area; })[0] || {}).label;
  document.getElementById("bar").style.width = Math.round(pos / inArea.length * 100) + "%";
  document.getElementById("barLabel").textContent = secLabel
    ? secLabel + " · " + pos + " / " + inArea.length : "Home";
  document.getElementById("where").textContent = page.navTitle;

  window.scrollTo(0, 0);
  document.getElementById("main").focus({preventScroll:true});
  closeRail();
}

function route(){
  var slug = decodeURIComponent(location.hash.replace(/^#\/?/, "").replace(/\/$/, ""));
  render(bySlug[slug] || byId.home);
}

/* rail open/close on small screens */
var rail = document.getElementById("rail"), scrim = document.getElementById("scrim"), burger = document.getElementById("burger");
function openRail(){ rail.classList.add("open"); scrim.classList.add("on"); burger.setAttribute("aria-expanded","true"); }
function closeRail(){ rail.classList.remove("open"); scrim.classList.remove("on"); burger.setAttribute("aria-expanded","false"); }
burger.addEventListener("click", function(){ rail.classList.contains("open") ? closeRail() : openRail(); });
scrim.addEventListener("click", closeRail);
document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeRail(); });

/* filter */
var searchBtn = document.getElementById("searchBtn"), filter = document.getElementById("filter"), filterInput = document.getElementById("filterInput");
searchBtn.addEventListener("click", function(){
  var on = filter.classList.toggle("on");
  searchBtn.setAttribute("aria-expanded", String(on));
  if (on) filterInput.focus(); else { filterInput.value = ""; applyFilter(); }
});
filterInput.addEventListener("input", applyFilter);
function applyFilter(){
  var q = filterInput.value.trim().toLowerCase();
  document.querySelectorAll(".nav-item").forEach(function(a){
    var hit = !q || a.textContent.toLowerCase().indexOf(q) > -1;
    a.classList.toggle("hide", !hit);
  });
}

buildNav();

/* Handle in-site links ourselves. Some preview and embed frames treat every
   anchor as leaving the page, so navigate in JS and only fall back to the
   address bar. External links are untouched. */
window.addEventListener("click", function(e){
  if (e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  var t = e.target, a = (t && t.closest) ? t.closest('a[href^="#/"]') : null;
  if (!a) return;
  var href = a.getAttribute("href"), slug = href.slice(2).replace(/\/$/, "");
  var page = bySlug[slug];
  if (!page) return;
  e.preventDefault();
  e.stopImmediatePropagation();
  try { if (location.hash !== href) history.pushState(null, "", href); } catch (err) {}
  render(page);
}, true);

window.addEventListener("hashchange", route);
window.addEventListener("popstate", route);
route();
</script>
</body>
